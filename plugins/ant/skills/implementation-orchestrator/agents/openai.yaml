interface:
  display_name: "(ant) Implementation Orchestrator"
  short_description: "Plan, set native goals, implement, verify, and deliver"
  default_prompt: "Use $implementation-orchestrator in Codex after selecting or verifying the task/session root at the strongest available model and maximum available effort. Pin every child with a real model and explicit supported effort at High or lower. Use fork_turns=none for history-free children and at most fork_turns=1 for the primary tracked writer when the preceding user turn directly authorizes the stable plan; never inherit the full conversation. Route child questions to root, resolve decisions already covered by the plan without duplicate user approval, and ask me only for genuinely new authority. Classify whether I want analysis only, implementation, or clarification; discover the repository and present a concrete plan before edits. For implementation-authorized or later-approved work, inspect and reuse or create a matching native goal after the plan is stable and before tracked-writer dispatch when goal tools are available. Continue after the plan checkpoint when my request explicitly authorizes execution and scope/risk remain unchanged; otherwise wait for approval. If merge-request reports an in-scope pipeline regression, delegate its repair, review, validation, and final-suite refresh before returning delivery to merge-request for replacement-pipeline observation. Implement and verify proportionally, then perform a bounded execution retrospective before completing the goal or delivery."
