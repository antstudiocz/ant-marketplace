interface:
  display_name: "(ant) Implementation Orchestrator"
  short_description: "Plan, implement, verify, reflect, and deliver"
  default_prompt: "Use $implementation-orchestrator in Codex after selecting or verifying the task/session root at the strongest available model and maximum available effort. Pin every child with a real model, explicit supported effort at High or lower, and fork_turns=none with concise self-contained task context; it cannot change the already-running root. Classify whether I want analysis only, implementation, or clarification; discover the repository and present a concrete plan before edits. Continue after that checkpoint when my request explicitly authorizes execution and scope/risk remain unchanged; otherwise wait for approval. Implement and verify proportionally, then perform a bounded execution retrospective before completion or delivery."
