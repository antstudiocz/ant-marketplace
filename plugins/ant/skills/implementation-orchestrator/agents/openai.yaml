interface:
  display_name: "(ant) Implementation Orchestrator"
  short_description: "Plan, set native goals, implement, verify, and deliver"
  default_prompt: "Use $implementation-orchestrator in Codex after selecting or verifying the task/session root at the strongest available model and maximum available effort. Pin every child with a real model, explicit supported effort at High or lower, and fork_turns=none with concise self-contained task context; it cannot change the already-running root. Classify whether I want analysis only, implementation, or clarification; discover the repository, make the proportionate continuity decision, and present a concrete plan before edits. Record an existing continuity choice, avoid asking when modes do not materially differ, and otherwise obtain explicit acceptance before integrated replacement. For implementation-authorized or later-approved work, inspect and reuse or create a matching native goal after the plan is stable and before tracked-writer dispatch when goal tools are available. Continue after the plan checkpoint when my request explicitly authorizes execution and scope/risk remain unchanged; otherwise wait for approval. If merge-request reports an in-scope pipeline regression, delegate its repair, review, validation, and final-suite refresh before returning delivery to merge-request for replacement-pipeline observation. Implement and verify proportionally, then perform a bounded execution retrospective before completing the goal or delivery."
