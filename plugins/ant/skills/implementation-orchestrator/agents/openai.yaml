interface:
  display_name: "(ant) Implementation Orchestrator"
  short_description: "Plan, set native goals, implement, verify, and deliver"
  default_prompt: "Use $implementation-orchestrator in Codex with root pinned to gpt-5.6-sol at High. Use native Plan and Goal: record phases/waves with one top-level in_progress item, represent concurrency with native agent/thread state, establish Goal after Plan is stable and before tracked-writer dispatch, amend both for stable in-scope follow-ups, and require a delta decision for material scope or contract changes. Native Goal tools are mandatory before tracked-writer dispatch; if unavailable, fail closed before tracked edits after read-only discovery/planning. During read-only discovery, before the continuity decision or concrete plan, derive only material quality attributes and constraints from repository/user evidence; record lighter/heavier rationale in the Plan and relevant writer/reviewer assignments, choose the smallest durable solution, and never claim performance/scalability without measurements or verified constraints. Design async/concurrency tests deterministically with observable synchronization, bounded timeouts, isolated state, cleanup, virtual time, and CI-like repeat/shuffle/seed where applicable; retries diagnose only and never hide flakes. Pin every child with a real model, explicit supported effort at High or lower, fork_turns=none, and concise self-contained task context; use gpt-5.6-sol High for Strong roles such as architecture, security, migrations, high-risk/cross-contract integration judgment, and final review; use gpt-5.6-luna High for normal implementation and integration leads owning stable shared files/contracts, and Luna at proportional High/Medium/Low for every other child; there is no Terra route or fallback. Never restart a blocked child with inherited history. Root is the sole user-facing adjudicator: children never address me or formulate questions, and instead escalate evidence, options, a recommendation, and paused scope only to their parent. Keep raw logs, large diffs, debug history, repeated tool calls, and local failures in related-agent repair loops; send root compact knowledge deltas. Support disjoint parallel backend/frontend/test/research/implementation workers behind one integration lead. Root first resolves from repository evidence, the stable authorized plan, and prior decisions, then batches only genuinely new material authority into one concrete question. Treat declined patch/fileChange/policy classifications separately from real native user-only approval gates, and never weaken architecture, behavior, tests, validation, or compatibility to avoid approval. Keep all verified material actionable adjacent findings separate from the at-most-three execution retrospective findings; fix or lower/block readiness for current gaps and never auto-add CI enforcement. For executable/runtime/user-visible changes, plan the smallest realistic smoke flows, then after the final suite discover actual capabilities and offer every applicable testing surface with exactly one evidence-based recommendation, leaving tool selection to the user unless an explicit prior choice applies; map repository-native/standalone Playwright, Browser, Chrome, and Computer Use only when available, and capture environment/head, outcomes, side effects, gaps, and screenshots where supported. Classify whether I want analysis only, implementation, or clarification; discover the repository, make the proportionate continuity decision, and present a concrete plan before edits. Continue after the plan checkpoint when my request explicitly authorizes execution and scope/risk remain unchanged; otherwise wait for approval. Distinguish implementing and testing future production behavior from actually deploying or running it. If merge-request reports an in-scope pipeline regression, delegate its repair, review, validation, and final-suite refresh before returning delivery to merge-request for replacement-pipeline observation. Implement and verify proportionally, report all adjacent findings, then perform a bounded execution retrospective before completing the Goal or delivery."
